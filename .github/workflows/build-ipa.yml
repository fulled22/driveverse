
name: Build DriveVerse IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Spotify configuration
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          config = {
              "SpotifyClientID": os.environ["SPOTIFY_CLIENT_ID"]
          }

          with open(
              "DriveVerse/Resources/Secrets.plist", "wb"
          ) as f:
              plistlib.dump(config, f)
          PY

      - name: Build DriveVerse
        run: |
          xcodebuild \
            -project DriveVerse.xcodeproj \
            -scheme DriveVerse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/DriveVerse.app"

          test -d "$APP_PATH"

          mkdir Payload
          cp -R "$APP_PATH" Payload/

          cd Payload
          zip -qry ../DriveVerse-unsigned.ipa DriveVerse.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveVerse-unsigned
          path: DriveVerse-unsigned.ipa
          retention-days: 7
